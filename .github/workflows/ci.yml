name: Build and security checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:keeper
      - run: node --test services/market-maker/*.test.mjs
      - run: node --test services/payout-signer/*.test.mjs
      - run: node --test contracts/scripts/*.test.mjs
      # The Vela SDK in the private-trading chunk retains elliptic/GHSA-848j-6mx2-7j84 (low, no fix exists),
      # as in the sdk-crypto-evaluation job. See security/README.md. A passing job is not a clean audit claim.
      - run: npm audit --audit-level=moderate

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go test -run='^$' -fuzz=FuzzCommandSequences -fuzztime=30s -parallel=2
      - run: go test -run='^$' -fuzz=FuzzExactOraclePriceComparison -fuzztime=20s -parallel=2
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...

  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: bash scripts/install-deps.sh
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci
      - run: python3 scripts/export-abi.py && git diff --exit-code -- abi/
      - run: npm audit --audit-level=low
      - run: pipx install slither-analyzer==0.11.5
      - run: slither . --filter-paths 'node_modules|lib|test|script' --fail-medium

  sdk-crypto-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adapters/vela/crypto
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test
      # The upstream SDK retains elliptic/GHSA-848j-6mx2-7j84 (low).
      # The frontend also bundles the SDK, in the lazily loaded private-trading chunk (same advisory, same threshold).
      # See security/README.md. A passing job is not a clean audit claim.
      - run: npm audit --audit-level=moderate

  # Native tests of the Vela guest (evaluation only). No wasm is built and upstream Vela (BSL) is not
  # fetched here, so the wasm and upstream conformance tests skip; they run locally (adapters/vela/guest/README.md).
  # Also the stack slice's evaluation contracts (clock trigger, test token), kept out of the contracts job.
  vela-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/vela/guest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      # forge-std and OpenZeppelin come from contracts/, by relative path (adapters/vela/stack/contracts/foundry.toml).
      # The trigger's tests also compile contracts/src/StreamsRoundRegistry.sol (it needs contracts-upgradeable)
      # and the fixture oracle in contracts/test/mocks, read-only, so the trigger is tested against the real registry.
      - run: bash contracts/scripts/install-deps.sh
        working-directory: .
      - run: forge fmt --check && forge test
        working-directory: adapters/vela/stack/contracts

  protocol-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.2
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.1
          cache: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - run: npm ci
      - run: bash contracts/scripts/install-deps.sh
      - run: forge build --root contracts
      # The deployment tools create only the build the committed release pins. This is the job that has
      # both the node modules and the forge output, so the pin is compared with a real build here.
      - run: node --test contracts/scripts/*.test.mjs
        env:
          ZEDGE_REQUIRE_BUILD: 1
      - run: python3 scripts/install-wasm-tools.py "$RUNNER_TEMP/zedge-tools"
      - run: bash scripts/build-wasm.sh
        env:
          ZEDGE_WASM_TOOL_ROOT: ${{ runner.temp }}/zedge-tools
      - run: npm run test:protocol
        env:
          ZEDGE_SCENARIO_WASM: adapters/vela/build/scenario.wasm

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all --ignore-gitleaks-allow .'
