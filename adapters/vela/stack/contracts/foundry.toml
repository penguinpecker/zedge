# Contracts of the Vela book: BookClockTrigger (the book's clock trigger, UUPS),
# and, for the local evaluation slice, EvaluationClockTrigger and a 6-decimal
# test token. Kept out of contracts/ so that the registry's contract CI never
# builds them. Build output goes to build/ (git-ignored). The tests also compile
# the round registry, its unsigned fixture oracle and the deposit inbox from
# contracts/ (read-only), so the triggers are tested against the real ones.
[profile.default]
src = "src"
test = "test"
out = "build/out"
cache_path = "build/cache"
test_failures_file = "build/cache/test-failures"
libs = []
allow_paths = [
  "../../../../contracts/lib/forge-std",
  "../../../../contracts/node_modules/@openzeppelin/contracts",
  "../../../../contracts/node_modules/@openzeppelin/contracts-upgradeable",
  "../../../../contracts/src",
  "../../../../contracts/test/mocks",
]
solc = "0.8.30"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
  "forge-std/=../../../../contracts/lib/forge-std/src/",
  "@openzeppelin/contracts/=../../../../contracts/node_modules/@openzeppelin/contracts/",
  "@openzeppelin/contracts-upgradeable/=../../../../contracts/node_modules/@openzeppelin/contracts-upgradeable/",
  "zedge-contracts/=../../../../contracts/",
]

[profile.default.fuzz]
runs = 1024
failure_persist_dir = "build/cache/fuzz"
